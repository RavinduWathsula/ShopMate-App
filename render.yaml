services:
  - type: web
    name: shopmate-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DB_URL
        fromDatabase:
          name: shopmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0
databases:
  - name: shopmate-db
    databaseName: shopmate
    user: shopmate_user
