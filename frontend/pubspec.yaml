name: shopmate
description: "ShopMate - AI-powered smart shopping assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
